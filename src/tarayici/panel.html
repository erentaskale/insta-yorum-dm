<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DM Paneli</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
<style>
  /* Tasarım B: gri temel, durumlar renkli (aktif yeşil, sıra turuncu, token mavi).
     Açık/karanlık cihazın ayarını takip eder. */
  :root {
    --zemin: #f2f2f1; --yuz: #ffffff; --yazi: #202020; --ikinci: #6b6b6b; --cizgi: #e2e2e0;
    --yesil: #1f9d55; --yesil-zemin: #dcf5e6; --yesil-yazi: #146c3a;
    --turuncu-zemin: #fdecd3; --turuncu-yazi: #9a5a07;
    --mavi-zemin: #dde9fb; --mavi-yazi: #1f4f9a;
    --kirmizi: #c03535; --kirmizi-zemin: #fbe3e3; --kirmizi-yazi: #8f2222;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --zemin: #161616; --yuz: #212121; --yazi: #ededed; --ikinci: #9a9a9a; --cizgi: #2e2e2e;
      --yesil: #34c46e; --yesil-zemin: #173524; --yesil-yazi: #7be0a3;
      --turuncu-zemin: #3a2a12; --turuncu-yazi: #f3b55c;
      --mavi-zemin: #16263f; --mavi-yazi: #8ab4f2;
      --kirmizi: #f07070; --kirmizi-zemin: #3d1a1a; --kirmizi-yazi: #f5a3a3;
    }
  }

  * { box-sizing: border-box; }
  body { font-family: "DM Sans", system-ui, sans-serif; background: var(--zemin); color: var(--yazi); margin: 0; }
  .sayfa { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .cikis { padding: 6px 14px; border: 1px solid var(--cizgi); border-radius: 999px; background: var(--yuz); color: var(--ikinci); font-size: 14px; }

  /* Özet kartları */
  .ozet { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 18px 0; }
  .ozet div { background: var(--yuz); border-radius: 14px; padding: 12px 14px; }
  .ozet span { display: block; font-size: 13px; opacity: .8; }
  .ozet b { font-size: 22px; font-weight: 600; }
  .ozet .yesil { background: var(--yesil-zemin); color: var(--yesil-yazi); }
  .ozet .turuncu { background: var(--turuncu-zemin); color: var(--turuncu-yazi); }
  .ozet .mavi { background: var(--mavi-zemin); color: var(--mavi-yazi); }
  .ozet .kirmizi { background: var(--kirmizi-zemin); color: var(--kirmizi-yazi); }
  .uyari { background: var(--kirmizi-zemin); color: var(--kirmizi-yazi); padding: 12px 14px; border-radius: 14px; margin: 0 0 18px; }

  /* B yerleşimi: solda liste, sağda ayar */
  .duzen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
  .liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .satir { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px; border: 1.5px solid transparent; border-radius: 14px; background: var(--yuz); transition: border-color .15s; }
  .satir:hover { border-color: var(--cizgi); }
  .satir.secili { border-color: var(--yesil); }
  .satir img { width: 48px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--cizgi); flex: none; }
  .bilgi { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .bilgi .aciklama { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
  .etiket { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; max-width: 100%;
            font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px;
            background: var(--cizgi); color: var(--ikinci); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etiket::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .etiket.aktif { background: var(--yesil-zemin); color: var(--yesil-yazi); }
  .etiket.aktif::before { background: var(--yesil); }

  .ayar { background: var(--yuz); border-radius: 16px; padding: 18px; position: sticky; top: 16px; }
  .ayar form { display: flex; flex-direction: column; gap: 14px; }
  .ust { display: flex; gap: 14px; }
  .ust img { width: 90px; height: 120px; object-fit: cover; border-radius: 10px; background: var(--cizgi); flex: none; }
  .ust > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .ust p { margin: 0; }
  .ust .aciklama { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
  .ust .dm { color: var(--ikinci); font-size: 14px; }
  .ust a { color: var(--yesil-yazi); font-size: 14px; }

  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ikinci); }
  input:not([type]), textarea { padding: 10px 12px; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--zemin); color: var(--yazi); resize: vertical; }
  input:not([type]):focus, textarea:focus { outline: 2px solid var(--yesil); outline-offset: -1px; }

  /* Aktif anahtarı: checkbox'ı düğme gibi çiz */
  label.anahtar { flex-direction: row; align-items: center; gap: 10px; color: var(--yazi); font-size: 16px; cursor: pointer; }
  label.anahtar input { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--cizgi); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
  label.anahtar input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  label.anahtar input:checked { background: var(--yesil); }
  label.anahtar input:checked::after { transform: translateX(18px); }
  label.anahtar input:focus-visible { outline: 2px solid var(--yesil); outline-offset: 2px; }

  .kaydet { align-self: flex-start; padding: 10px 22px; border: 0; border-radius: 999px; background: var(--yesil); color: #fff; font-weight: 600; }
  .kaydet:disabled { opacity: .6; }
  .hata { color: var(--kirmizi); margin: 0; }
  .sonuc { color: var(--yesil-yazi); margin: 0; }
  .bos { color: var(--ikinci); margin: 0; }

  @media (max-width: 760px) {
    .duzen { grid-template-columns: minmax(0, 1fr); } /* minmax: uzun başlık satırı ekrandan taşırmasın */
    .ayar { position: static; }
    .ozet { grid-template-columns: 1fr 1fr; }
    .ozet div:last-child { grid-column: 1 / -1; }
    .ozet b { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="sayfa">
  <header>
    <h1>DM Paneli</h1>
    <form method="post" action="/cikis"><button class="cikis">Çıkış yap</button></form>
  </header>

  <section class="ozet">
    <div class="yesil"><span>Bugün giden DM</span><b id="bugun">–</b></div>
    <div class="turuncu"><span>Sırada bekleyen</span><b id="sirada">–</b></div>
    <div><span>DM (son 30 gün)</span><b id="toplam">–</b></div>
    <div><span>Aktif video</span><b id="aktifSayi">–</b></div>
    <div class="mavi" id="tokenKarti"><span>Token</span><b id="token">–</b></div>
  </section>
  <p id="uyari" class="uyari" hidden></p>

  <div class="duzen">
    <ul id="liste" class="liste"><li class="bos">Videolar yükleniyor…</li></ul>
    <section id="ayar" class="ayar"><p class="bos">Soldan bir video seç.</p></section>
  </div>
</div>

<template id="satirSablonu">
  <li><button class="satir" type="button">
    <img alt="" loading="lazy">
    <span class="bilgi"><span class="aciklama"></span><span class="etiket"></span></span>
  </button></li>
</template>

<template id="ayarSablonu">
  <form novalidate>
    <div class="ust">
      <img alt="">
      <div>
        <p class="aciklama"></p>
        <p class="dm"></p>
        <a class="link" target="_blank" rel="noopener noreferrer">Instagram'da aç</a>
      </div>
    </div>
    <label class="anahtar"><input type="checkbox" name="aktif"> Aktif: bu videoya DM gitsin</label>
    <label>Altın kelime<input name="kelime" maxlength="50" placeholder="skill" autocomplete="off"></label>
    <label>Gidecek mesaj<textarea name="mesaj" rows="5" maxlength="1000" placeholder="Selam! İstediğin dosya burada: https://..."></textarea></label>
    <p class="hata" hidden></p>
    <button class="kaydet">Kaydet</button>
    <p class="sonuc" hidden></p>
  </form>
</template>

<script src="/panel.js"></script>
</body>
</html>
